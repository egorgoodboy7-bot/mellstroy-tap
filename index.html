<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mellstroy Tap</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    h1 { margin-bottom: 5px; font-size: 24px; color: #ffcc00; }
    .score-container { font-size: 36px; font-weight: bold; margin-bottom: 20px; }
    .click-area { position: relative; display: inline-block; cursor: pointer; }
    .click-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      border: 4px solid #ffcc00;
      transition: transform 0.05s ease;
      box-shadow: 0 0 25px rgba(255, 204, 0, 0.4);
    }
    .click-img:active { transform: scale(0.92); }
    .floating-text {
      position: absolute;
      font-size: 28px;
      font-weight: bold;
      color: #00ff66;
      pointer-events: none;
      animation: floatUp 0.8s ease-out forwards;
    }
    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-80px); }
    }
  </style>
</head>
<body>

  <h1>MELLSTROY TAP</h1>
  <div class="score-container">💰 <span id="score">0</span></div>

  <div class="click-area" id="tapArea">
    <img src="https://i.ibb.co/3sS7v7L/mell.jpg" alt="Mellstroy" class="click-img" id="mellImg">
  </div>

  <script>
    let score = 0;
    const scoreElement = document.getElementById('score');
    const tapArea = document.getElementById('tapArea');

    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    tapArea.addEventListener('click', (e) => {
      score++;
      scoreElement.innerText = score;

      const floatText = document.createElement('div');
      floatText.className = 'floating-text';
      floatText.innerText = '+1';

      const rect = tapArea.getBoundingClientRect();
      floatText.style.left = `${e.clientX - rect.left - 10}px`;
      floatText.style.top = `${e.clientY - rect.top - 20}px`;

      tapArea.appendChild(floatText);

      setTimeout(() => { floatText.remove(); }, 800);
    });
  </script>
</body>
</html>
